.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--gold-bright);
}

.brand-copy {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: 0.08em;
}

.brand-copy small {
  color: var(--muted);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.28em;
}

.reset-button {
  min-height: 40px;
  padding: 0 2px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
}

.reset-button:focus-visible,
.draw-button:focus-visible,
.modal button:focus-visible {
  outline: 2px solid var(--gold-bright);
  outline-offset: 3px;
}

.stage {
  display: grid;
  align-content: center;
  gap: clamp(14px, 2.7vh, 24px);
  min-height: 0;
  padding: 10px 0 8px;
}

.intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 112px;
  text-align: center;
}

.event-title {
  display: block;
  width: min(84%, 330px);
  height: auto;
  filter: drop-shadow(0 8px 20px rgba(1, 17, 18, 0.3));
}

.brand-logo-main {
  object-fit: contain;
}

h1 {
  max-width: 92%;
  margin: -7px 0 0;
  color: var(--gold-bright);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.4;
  letter-spacing: 0.1em;
  text-align: center;
  white-space: nowrap;
}

.deck-wrap {
  position: relative;
  width: min(76vw, 304px);
  aspect-ratio: 5 / 6.3;
  margin: 0 auto;
  perspective: 1200px;
  user-select: none;
}

.card,
.ghost-card {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
}

.ghost-card {
  border: 1px solid rgba(231, 198, 129, 0.19);
  background: #15504d;
  box-shadow: 0 22px 45px rgba(2, 18, 19, 0.3);
}

.ghost-card-one {
  transform: rotate(-3.8deg) translate(-5px, 4px);
}

.ghost-card-two {
  transform: rotate(4.7deg) translate(6px, 7px);
  background: #0b3435;
}

.card {
  z-index: 2;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 680ms var(--ease);
}

.card.is-flipped {
  transform: rotateY(180deg);
}

.card.is-drawing {
  animation: lift-card 620ms var(--ease);
}

.card-face {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(231, 198, 129, 0.55);
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 30px 70px rgba(2, 17, 18, 0.46), inset 0 1px rgba(255, 255, 255, 0.1);
}

.card-back {
  align-items: center;
  justify-content: center;
  padding: 16px;
  background:
    linear-gradient(rgba(7, 65, 62, 0.7), rgba(5, 43, 43, 0.9)),
    url("assets/anniversary-palette.png") center / cover no-repeat;
}

.card-back::before,
.card-back-inner::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid var(--line);
  border-radius: calc(var(--radius) - 6px);
}

.card-back-inner {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  border: 1px solid rgba(231, 198, 129, 0.15);
  border-radius: calc(var(--radius) - 8px);
}

.card-logo {
  display: block;
  width: 82%;
  height: auto;
  filter: drop-shadow(0 8px 26px rgba(2, 21, 21, 0.38));
}

.card-back-label {
  margin-top: 5px;
  color: rgba(255, 242, 212, 0.7);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.4em;
}

.card-front {
  justify-content: space-between;
  padding: clamp(18px, 5vw, 28px);
  background:
    radial-gradient(circle at 90% 5%, rgba(255, 255, 255, 0.86), transparent 26%),
    linear-gradient(145deg, #fff3d8, #efcd91);
  color: var(--ink);
  transform: rotateY(180deg);
}

.card-front::after {
  content: "8";
  position: absolute;
  right: -12px;
  bottom: -42px;
  color: rgba(11, 82, 80, 0.08);
  font-family: Georgia, serif;
  font-size: 190px;
  font-style: italic;
  line-height: 1;
  pointer-events: none;
}

.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(42, 16, 16, 0.18);
}

.card-number {
  color: var(--teal);
  font-size: 13px;
  font-weight: 750;
  letter-spacing: 0.06em;
}

.card-type {
  color: rgba(42, 16, 16, 0.72);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
}

.card-copy {
  position: relative;
  z-index: 1;
  margin: auto 0;
  font-size: clamp(19px, 5vw, 23px);
  font-weight: 650;
  line-height: 1.38;
  letter-spacing: -0.025em;
}

.card-note {
  position: relative;
  z-index: 1;
  min-height: 23px;
  margin: 0;
  color: var(--teal);
  font-size: clamp(16px, 4vw, 17px);
  font-weight: 650;
  line-height: 1.3;
}

.controls {
  display: grid;
  justify-items: center;
  gap: 10px;
}

.remaining {
  margin: 0;
  color: var(--gold-bright);
  font-size: 13px;
  letter-spacing: 0.08em;
}

.remaining strong {
  display: inline-block;
  min-width: 1.5em;
  font-family: Georgia, serif;
  font-size: 17px;
  font-style: italic;
}

.draw-button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(100%, 330px);
  min-height: 56px;
  padding: 0 21px;
  border: 1px solid #f3dca7;
  border-radius: var(--radius);
  background: var(--gold-bright);
  color: #143b39;
  font-size: 16px;
  font-weight: 750;
  cursor: pointer;
  box-shadow: 0 14px 32px rgba(9, 1, 2, 0.25);
  transition: transform 180ms var(--ease), background-color 180ms ease;
}

.draw-button:active {
  transform: scale(0.98);
}

.draw-button[disabled] {
  cursor: default;
  opacity: 0.58;
}

.button-arrow {
  font-size: 22px;
  font-weight: 400;
}

.hint {
  margin: 0;
  color: rgba(244, 231, 207, 0.45);
  font-size: 11px;
  letter-spacing: 0.06em;
}

footer {
  padding-top: 8px;
  color: rgba(231, 198, 129, 0.35);
  font-family: Georgia, serif;
  font-size: 8px;
  letter-spacing: 0.23em;
  text-align: center;
}

.modal[hidden] {
  display: none;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: end center;
  padding: 18px max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(2, 18, 20, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal-panel {
  position: relative;
  width: min(100%, 420px);
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #0b3435;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
  animation: modal-in 320ms var(--ease);
}

.modal-panel h2 {
  margin: 0 0 10px;
  font-size: 21px;
}

.modal-panel p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.65;
}

.modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 22px;
}

.modal-actions button {
  min-height: 48px;
  border-radius: 12px;
  font-weight: 650;
  cursor: pointer;
}

.modal-cancel {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--paper);
}

.modal-confirm {
  border: 1px solid var(--gold);
  background: var(--gold-bright);
  color: #143b39;
}

@keyframes lift-card {
  0% { transform: translateY(0) rotateZ(0); }
  42% { transform: translateY(-18px) rotateZ(1.2deg); }
  100% { transform: translateY(0) rotateZ(0); }
}

@keyframes modal-in {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (min-width: 680px) {
  body {
    background:
      radial-gradient(circle at center, #164847, transparent 48%),
      #061719;
  }

  .app {
    box-shadow: 0 0 90px rgba(0, 0, 0, 0.55);
  }
}

@media (max-height: 720px) {
  .app {
    padding-top: max(10px, env(safe-area-inset-top));
  }

  .topbar {
    min-height: 45px;
  }

  .stage {
    gap: 10px;
    padding-top: 2px;
  }

  .hint,
  footer {
    display: none;
  }

  h1 {
    display: block;
    margin-top: -4px;
    font-size: 11px;
    letter-spacing: 0.05em;
  }

  .intro {
    min-height: 88px;
  }

  .event-title {
    width: min(78%, 270px);
  }

  .deck-wrap {
    width: min(60vw, 245px);
  }

  .draw-button {
    min-height: 50px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (prefers-reduced-transparency: reduce) {
  .modal-backdrop {
    background: rgba(8, 1, 2, 0.94);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
}

            <div class="card-face card-front" id="cardFront">
              <div class="card-meta">
                <span class="card-number" id="cardNumber">真心卡</span>
                <span class="card-type" id="cardType">NO.05</span>
              </div>
              <p class="card-copy" id="cardCopy">如果回到刚来新美颜的第一天，你最想提醒自己什么？</p>
              <p class="card-note" id="cardNote" style="visibility: visible;">回答后指定下一位；没有答案，喝一口再指定。</p>
            </div>
          </article>
        </div>

        <div class="controls">
          <p class="remaining" id="remaining" aria-live="polite">本轮已全部抽完</p>
          <button class="draw-button" id="drawButton" type="button">
            <span id="drawButtonLabel">重新洗牌，再来一轮</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>
          <p class="hint" id="hint">15张卡已全部出现</p>
        </div>
      </section>

      <footer>NEW BEAUTY · 8TH ANNIVERSARY</footer>
    </main>

    <div class="modal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden="">
      <div class="modal-backdrop" data-close-modal=""></div>
      <div class="modal-panel">
        <h2 id="modalTitle">重新开始这一轮？</h2>
        <p>所有卡片会重新洗牌，当前抽卡进度将被清空。</p>
        <div class="modal-actions">
          <button class="modal-cancel" type="button" data-close-modal="">继续当前</button>
          <button class="modal-confirm" id="confirmReset" type="button">重新洗牌</button>
        </div>
      </div>
    </div>
    <script>
(function () {
  "use strict";

  var cards = [
    { id: "01", type: "猜拳", copy: "指定现场另一人，和他石头剪刀布。", note: "输的人喝一口并抽下一张；平局立即重来。" },
    { id: "02", type: "碰杯", copy: "选一位今晚还没单独碰过杯的人，说明为什么想和他碰这一杯。", note: "碰杯后，由对方抽下一张。如果已经和所有人碰过杯，可任选一人。" },
    { id: "03", type: "转移", copy: "保留此卡，暂时不用。以后轮到你完成任务或喝一口时，可以使用此卡，指定现场一人替你完成。", note: "只能使用一次，用完作废。现在由你指定下一位抽卡。" },
    { id: "04", type: "挑战", copy: "假装第一次来新美颜应聘，用10秒钟做一次“离谱版自我介绍”。", note: "完成后指定下一位抽卡；拒绝挑战则喝一口，再指定下一位。" },
    { id: "05", type: "真心", copy: "如果回到刚来新美颜的第一天，你最想提醒自己什么？", note: "回答后指定下一位；没有答案，喝一口再指定。" },
    { id: "06", type: "感谢", copy: "选一位现场的人，在10秒内说出一件想感谢他的原因。", note: "与他碰杯后，由他抽下一张。" },
    { id: "07", type: "幸运", copy: "幸运过关！这张卡不需要完成任务，也不用喝。", note: "由你指定下一位抽卡。" },
    { id: "08", type: "左右", copy: "和左边的人碰杯，各喝一口。", note: "右边的人直接抽下一张。" },
    { id: "09", type: "夸夸", copy: "指定一人，要求对方10秒内用5个字夸他。", note: "未完成对方喝一口，并抽下一张；完成你指定下一位。" },
    { id: "10", type: "逗笑", copy: "指定一人，15秒内你把他逗笑。", note: "完成对方喝一口，并抽下一张；未完成你喝并指定下一位。" },
    { id: "11", type: "复刻", copy: "做一个简单动作，右边的人立刻模仿。", note: "模仿成功，你喝一口并继续抽；模仿失败，对方喝一口并抽下一张。" },
    { id: "12", type: "口型", copy: "选择一个离自己超过3个人的队友进行口型传话，你说他猜。", note: "答案正确，过关；错误两人一起喝，再来一次。共5轮。" },
    { id: "13", type: "真假", copy: "10秒内说两件关于自己的事，一件真、一件假。指定一人猜哪件是假的。", note: "猜错的人喝一口；猜对则你喝一口。由判断的人抽下一张。" },
    { id: "14", type: "猜动作", copy: "先指定一人。你表演一个日常动作，只能做动作，不能说话或提示。", note: "对方猜：猜对，你喝一口；猜错，对方喝一口。之后由对方抽下一张。" },
    { id: "15", type: "压点", copy: "你和右边的人玩手指压点。", note: "输的人喝一口，指定下一位。" }
  ];

  var storageKey = "xinmeiyan-8th-card-state-v3";
  var cardEl = document.getElementById("card");
  var drawButton = document.getElementById("drawButton");
  var drawButtonLabel = document.getElementById("drawButtonLabel");
  var remainingEl = document.getElementById("remaining");
  var hintEl = document.getElementById("hint");
  var numberEl = document.getElementById("cardNumber");
  var typeEl = document.getElementById("cardType");
  var copyEl = document.getElementById("cardCopy");
  var noteEl = document.getElementById("cardNote");
  var resetButton = document.getElementById("resetButton");
  var resetModal = document.getElementById("resetModal");
  var confirmReset = document.getElementById("confirmReset");
  var drawing = false;
  var state = loadState();

  function shuffle(items) {
    var result = items.slice();
    for (var i = result.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = result[i];
      result[i] = result[j];
      result[j] = temp;
    }
    return result;
  }

  function freshState() {
    return { order: shuffle(cards.map(function (card) { return card.id; })), drawn: [], current: null };
  }

  function loadState() {
    try {
      var saved = JSON.parse(localStorage.getItem(storageKey));
      var validIds = cards.map(function (card) { return card.id; });
      var orderValid = saved && Array.isArray(saved.order) && saved.order.length === cards.length && saved.order.every(function (id) { return validIds.indexOf(id) !== -1; });
      if (orderValid && Array.isArray(saved.drawn)) return saved;
    } catch (error) {
      // Storage is optional. The game still works when private browsing blocks it.
    }
    return freshState();
  }

  function saveState() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch (error) {
      // Keep in-memory state if storage is unavailable.
    }
  }

  function getCard(id) {
    return cards.filter(function (card) { return card.id === id; })[0];
  }

  function setCardContent(card) {
    numberEl.textContent = card.type + "卡";
    typeEl.textContent = "NO." + card.id;
    copyEl.textContent = card.copy;
    noteEl.textContent = card.note;
    noteEl.style.visibility = card.note ? "visible" : "hidden";
  }

  function render() {
    var remaining = cards.length - state.drawn.length;
    remainingEl.innerHTML = remaining > 0
      ? "本轮还剩 <strong>" + remaining + "</strong> 张"
      : "本轮已全部抽完";

    if (state.current) {
      setCardContent(getCard(state.current));
      cardEl.classList.add("is-flipped");
    } else {
      cardEl.classList.remove("is-flipped");
    }

    if (remaining === 0) {
      drawButtonLabel.textContent = "重新洗牌，再来一轮";
      hintEl.textContent = cards.length + "张卡已全部出现";
    } else if (state.current) {
      drawButtonLabel.textContent = "继续抽一张";
      hintEl.textContent = "本轮不会抽到重复卡片";
    } else {
      drawButtonLabel.textContent = "点击抽卡";
      hintEl.textContent = cards.length + "张一轮，随机且不重复";
    }
  }

  function draw() {
    if (drawing) return;

    if (state.drawn.length === cards.length) {
      resetGame(true);
      return;
    }

    drawing = true;
    drawButton.disabled = true;
    cardEl.classList.remove("is-flipped");
    cardEl.classList.add("is-drawing");

    window.setTimeout(function () {
      var nextId = state.order[state.drawn.length];
      state.drawn.push(nextId);
      state.current = nextId;
      setCardContent(getCard(nextId));
      saveState();
      cardEl.classList.add("is-flipped");
      render();

      window.setTimeout(function () {
        cardEl.classList.remove("is-drawing");
        drawButton.disabled = false;
        drawing = false;
      }, 700);
    }, 300);
  }

  function resetGame(drawImmediately) {
    state = freshState();
    saveState();
    cardEl.classList.remove("is-flipped");
    closeModal();
    render();
    if (drawImmediately) window.setTimeout(draw, 180);
  }

  function openModal() {
    resetModal.hidden = false;
    document.body.style.overflow = "hidden";
    window.setTimeout(function () { confirmReset.focus(); }, 10);
  }

  function closeModal() {
    resetModal.hidden = true;
    document.body.style.overflow = "";
    resetButton.focus();
  }

  drawButton.addEventListener("click", draw);
  cardEl.addEventListener("click", draw);
  resetButton.addEventListener("click", openModal);
  confirmReset.addEventListener("click", function () { resetGame(false); });

  Array.prototype.forEach.call(document.querySelectorAll("[data-close-modal]"), function (element) {
    element.addEventListener("click", closeModal);
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !resetModal.hidden) closeModal();
    if ((event.key === "Enter" || event.key === " ") && resetModal.hidden && document.activeElement === cardEl) draw();
  });

  cardEl.setAttribute("tabindex", "0");
  cardEl.setAttribute("role", "button");
  cardEl.setAttribute("aria-label", "抽一张卡");
  render();
}());

    </script>
